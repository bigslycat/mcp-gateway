name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_GLOBAL_CACHE: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            target: root:fmt-check
          - name: Lint
            target: root:lint
          - name: Types
            target: root:typecheck
          - name: Solution types
            target: root:typecheck-solution
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up proto toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
        with:
          proto-version: 0.63.2
          auto-install: true

      - name: Run check
        run: moon run ${{ matrix.target }}
